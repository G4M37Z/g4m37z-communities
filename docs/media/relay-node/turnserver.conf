# G4M37Z Relay Node — coturn config
# Full TURN control stays here; the secret comes from .env (TURN_SECRET).
# NEVER commit .env — it holds the signing secret the Vercel edge shares.

# Identity shown in STUN binding errors; must match the realm clients use.
realm=g4m37z.net
server-name=g4m37z-relay

# Ephemeral HMAC credentials (draft-uberti-behave-turn-rest-00)
use-auth-secret
static-auth-secret=${TURN_SECRET}
stale-nonce

# Oracle's VNIC has a private IP behind 1:1 NAT; coturn MUST advertise the
# public one. deploy.sh fills both lines and rewrites them here.
external-ip=__PUBLIC_IP__/__PRIVATE_IP__

# Ports the relay hands out (matches the Oracle ingress range)
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535

# Safety hardening — no anonymous CLI, no multicast poking, IPv4-first
no-cli
no-tlsv1
no-tlsv1_1
no-multicast-peers
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Throughput defaults tuned for calls: 32 kbps Opus audio is negligible;
# video stays capped so one relay allocation can't gobble the uplink.
user-quota=12
total-quota=120
bwidth=2000000
