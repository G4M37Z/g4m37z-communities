<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- G4M37Z brand mark — "call & response".
       Two interlocked crescents (the call above, the response below) and a
       spark dot answering at the right seam. Structured side of the brand.
       Reads from silhouette alone; works mono, 16px+. -->
  <path d="M 17.03 29.31 A 15.5 15.5 0 0 1 46.47 28.31"
        stroke="currentColor" stroke-width="11" stroke-linecap="round"/>
  <path d="M 25.5 49.5 A 16 16 0 0 0 50 49.5"
        stroke="currentColor" stroke-width="11" stroke-linecap="round"/>
  <circle cx="54.6" cy="39.8" r="4.8" fill="currentColor"/>
</svg>
