<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 40" fill="none">
  <!-- G4M37Z wordmark. Geometric-humanist caps drawn as paths (no font
       dependency). Distinct digits: slashed 4, closed 3, flat-top 7.
       Ink on transparent; recolor via fill. Baseline y=30, cap 24. -->
  <g fill="currentColor">
    <!-- G: geometric bowl + deep horizontal bar -->
    <path d="M 21.2 13.4 C 19.6 9.9 16.2 7.8 12.1 7.8 C 6.2 7.8 2 12.2 2 20 C 2 27.8 6.2 32.2 12.1 32.2 C 17.4 32.2 21.4 28.6 21.4 22.6 L 21.4 20.4 L 12.6 20.4 L 12.6 25 L 16.4 25 C 15.9 27 14.4 28 12.2 28 C 9 28 7 25.2 7 20 C 7 14.8 9 12 12.1 12 C 14.3 12 15.8 13.1 16.5 15 L 21.2 13.4 Z"/>
    <!-- 4: open apex, crossbar extends left -->
    <path d="M 24.6 32 L 24.6 27.4 L 33.6 8 L 39.6 8 L 39.6 27.2 L 42.4 27.2 L 42.4 31.8 L 39.6 31.8 L 39.6 36.5 L 34.9 36.5 L 34.9 32 L 24.6 32 Z M 29.5 27.2 L 35 27.2 L 35 15.1 L 29.5 27.2 Z"/>
    <!-- M: pointed center at baseline -->
    <path d="M 45.4 32 L 45.4 8 L 51.2 8 L 56.3 22.2 L 61.4 8 L 67.2 8 L 67.2 32 L 62.7 32 L 62.7 15.6 L 58.3 28 L 54.3 28 L 49.9 15.6 L 49.9 32 L 45.4 32 Z"/>
    <!-- 3: double-bowl, flat terminals -->
    <path d="M 84.1 13.8 C 82.7 9.8 79.8 7.8 76.2 7.8 C 71.4 7.8 68.3 11.2 68.3 15.7 C 68.3 19.4 70.5 21.7 73.6 22.7 C 70 23.6 67.6 26.2 67.6 29.8 L 72.4 29.8 C 72.5 27.7 74 26.5 76.3 26.5 C 78.7 26.5 80.2 27.9 80.2 30.1 L 80.2 32 L 84.9 32 L 84.9 30.4 C 84.9 27 82.9 24.7 79.9 23.6 C 83.3 22.6 85.4 20.1 85.4 16.5 C 85.4 15.5 85 13.8 84.1 13.8 Z M 76.5 11.9 C 78.6 11.9 80.2 13.4 80.2 15.6 C 80.2 17.9 78.6 19.3 76.4 19.3 C 74.2 19.3 72.8 17.8 72.8 15.6 C 72.8 13.4 74.3 11.9 76.5 11.9 Z" transform="translate(2 0)"/>
    <!-- 7: flat top, no serif -->
    <path d="M 89.4 8 L 105.6 8 L 105.6 12.4 L 97.5 32 L 92.5 32 L 100.6 12.4 L 89.4 12.4 L 89.4 8 Z"/>
